[project]
name = "01-docker-terraform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "notebook>=7.6.5",
    "pandas>=3.1.1",
    "psycopg[binary,pool]>=3.3.8",
    "pyarrow>=26.0.1",
    "sqlalchemy>=2.1.8",
    "tqdm>=4.70.1",
]

[project.scripts]
01-docker-terraform = "01_docker_terraform:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pgcli>=4.7.1",
]
